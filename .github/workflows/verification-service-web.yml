name: Verification Service Web Validation
on:
  push:
    branches:
      - 'working/verification-service-web-20260901'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public Verification Service integration
        run: python validation/test_verification_service_web.py
